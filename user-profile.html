
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VEYA - User Profile</title>

    <!-- Link to the user profile CSS file -->
    <link rel="stylesheet" href="user-profile.css">
</head>

<body>

    <!-- Main container for the user profile page -->
    <div class="profile-container">

        <!-- Sidebar with user information and navigation -->
        <aside class="sidebar">

            <!-- User information -->
            <div class="user-info">

                <!-- Profile picture placeholder -->
                <div class="profile-picture">
                    <span>👤</span>
                </div>

                <!-- User name and email -->
                <p class="user-name">Naomie Combolit</p>
                <p class="user-email">naomie@combolgmail.com</p>

            </div>

            <!-- Sidebar navigation -->
            <nav class="sidebar-nav">

                <a href="index.html">⌂ HOME</a>

                <a href="#">▤ NOTIFICATIONS</a>

                <a href="#">⚙ SETTINGS</a>

            </nav>

            <!-- Sign out link -->
            <a href="index.html" class="sign-out">SIGN OUT</a>

        </aside>

        <!-- Main content area -->
        <main class="profile-content">

            <!-- Grid with the user's places and collections -->
            <section class="profile-grid">

                <!-- Saved places -->
                <a href="#" class="profile-card">
                    <img src="images copy/pantheon-paris.jpg"
                         alt="Panthéon in Paris">
                    <span class="card-title">SAVED PLACES</span>
                </a>

                <!-- My collections -->
                <a href="#" class="profile-card">
                    <img src="images copy/typical-cafe-scene-paris.jpg"
                         alt="Paris restaurant">
                    <span class="card-title">MY COLLECTIONS</span>
                </a>

                <!-- Visited places -->
                <a href="#" class="profile-card">
                    <img src="images copy/eiffel-paris.jpg"
                         alt="Eiffel Tower in Paris">
                    <span class="card-title">VISITED PLACES</span>
                </a>

                <!-- Discover personalized recommendations -->
                <a href="#" class="profile-card">
                    <img src="images copy/paris-map.jpg"
                         alt="Travelers looking at a map">
                    <span class="card-title">DISCOVER FOR YOU</span>
                </a>

            </section>

            <!-- User's selected travel preferences -->
            <section class="preferences">

                <div class="preferences-header">
                    <h2>YOUR CHOSEN PREFERENCES</h2>
                    <a href="#">Edit preferences</a>
                </div>

                <!-- List of selected interests -->
                <div class="preferences-list">
                    <span>Local food</span>
                    <span>Lively &amp; Social</span>
                    <span>Vintage &amp; Thrifting</span>
                    <span>Solo time</span>
                    <span>Pet friendly</span>
                    <span>Art &amp; Creativity</span>
                </div>

            </section>

        </main>

    </div>

</body>
</html>
