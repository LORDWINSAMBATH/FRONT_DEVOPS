<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>VEYA - Travel</title>
    <!-- Police moderne proche de la maquette -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="hero-wrapper">
        <header class="main-head">
            <nav>
                <h1 id="logo">VEYA</h1>
                <ul>
                    <li><a href="#">BLOG</a></li>
                    <li><a href="#">ABOUT</a></li>
                    <li><a href="#">LOG IN</a></li>
                </ul>
            </nav>
        </header>

        <section class="hero">
            <!-- Centre : Titre + Barre de recherche -->
            <div class="hero-center">
                <h2>GET READY WITH VEYA</h2>
                <form class="search-bar">
                    <input type="text" placeholder="search your destination">
                    <button type="submit">Search</button>
                </form>
            </div>

            <!-- Bas de page : Infos à gauche et bouton à droite -->
            <div class="hero-bottom">
                <div class="info-list">
                    <p>Affordable prices</p>
                    <p>personalized travel planing</p>
                    <p>24/7 support</p>
                    <p class="phone">📞 +77 32 45 67</p>
                </div>

                <a href="#" class="explore-btn">Explore &nbsp; &gt;</a>
            </div>
        </section>
    </div>

</body>
</html>
